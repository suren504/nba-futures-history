name: Archive NBA Futures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,15 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NBA futures
        run: python3 scripts/fetch_futures.py

      - name: Commit snapshot when raw odds changed
        run: |
          git add data/

          if ! git diff --cached --name-only -- data/ | grep -qv '/_meta.json$'; then
            echo "Raw odds did not change. Discarding metadata-only changes."
            git restore --staged --worktree -- data/
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Archive NBA futures snapshot"
          git push

name: Archive NBA Futures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,15 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch NBA futures
        id: fetch
        run: python3 scripts/fetch_futures.py

      - name: Commit available snapshots and freshness metadata
        # Preserve any validated snapshots even if a later step in the script fails.
        if: ${{ !cancelled() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure') }}
        run: |
          git add data/

          if git diff --cached --quiet -- data/; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Archive NBA futures snapshot"
          git push
